name: Publish npm package (pcf-harness)

on:
  workflow_dispatch:

  # Enable this block when you want automatic publish on each commit to main.
  # push:
  #   branches: [main]
  #   paths:
  #     - 'harness/**'
  #     - '.github/workflows/publish-harness.yml'

concurrency:
  group: publish-harness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish harness to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: harness

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: harness/package-lock.json

      - name: Install Linux deps (libsecret for native modules)
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Read package metadata
        id: pkg
        shell: bash
        run: |
          echo "name=$(node -p \"require('./package.json').name\")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Check if this version is already on npm
        id: npm_check
        shell: bash
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Package version already exists on npm. Skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Package version not found on npm. Will publish."
          fi

      - name: Publish to npm
        if: steps.npm_check.outputs.already_published != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        shell: bash
        run: |
          echo "Package: ${{ steps.pkg.outputs.name }}"
          echo "Version: ${{ steps.pkg.outputs.version }}"
          if [ "${{ steps.npm_check.outputs.already_published }}" = "true" ]; then
            echo "Result: skipped (already published)"
          else
            echo "Result: published"
          fi
